<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食探偵 | Vibe Coding Restaurant Finder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        glassBg: 'rgba(255, 255, 255, 0.05)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(236, 72, 153, 0.4);
            box-shadow: 0 12px 30px -10px rgba(236, 72, 153, 0.3);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-16">

    <!-- Header / Navbar -->
    <header class="border-b border-white/10 glass-panel sticky top-0 z-50 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-amber-500 flex items-center justify-center shadow-lg shadow-pink-500/30">
                    <i class="fa-solid fa-utensils text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl tracking-wide bg-gradient-to-r from-white via-slate-200 to-pink-400 bg-clip-text text-transparent">美食探偵</h1>
                    <p class="text-xs text-slate-400">Vibe Coding 智慧餐廳推薦系統</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="triggerLuckyDraw()" class="px-4 py-2 text-xs font-semibold rounded-xl bg-gradient-to-r from-amber-500/20 to-pink-500/20 border border-amber-500/30 text-amber-300 hover:bg-amber-500/30 transition shadow-sm">
                    <i class="fa-solid fa-dice mr-1.5"></i> 選擇困難救星
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-8">
        
        <!-- Hero & Filter Section -->
        <section class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl mb-10 relative overflow-hidden">
            <div class="absolute -right-16 -top-16 w-64 h-64 bg-pink-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -left-16 -bottom-16 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center max-w-2xl mx-auto mb-8">
                <span class="inline-block py-1 px-3 rounded-full bg-pink-500/10 border border-pink-500/20 text-pink-400 text-xs font-semibold mb-3 tracking-wider uppercase">
                    ✨ AI Smart Matcher
                </span>
                <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-3">尋找你的命定美食</h2>
                <p class="text-slate-400 text-sm sm:text-base">輸入你的位置、想吃的料理與預算，秒速推薦當地前 10 家高評分名店！</p>
            </div>

            <!-- Search Form -->
            <form id="searchForm" onsubmit="handleSearch(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <!-- Location Input -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        <i class="fa-solid fa-location-dot text-pink-500 mr-1"></i> 所在地區 / 搜尋地點
                    </label>
                    <input type="text" id="locationInput" placeholder="例如：台北市信義區、高雄市左營區" required
                        class="w-full bg-slate-900/80 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 transition">
                </div>

                <!-- Cuisine Select -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        <i class="fa-solid fa-bowl-food text-amber-500 mr-1"></i> 料理種類
                    </label>
                    <select id="cuisineSelect"
                        class="w-full bg-slate-900/80 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 transition">
                        <option value="all">不限種類 (精選全方位)</option>
                        <option value="日式料理">日式料理 (壽司/拉麵/居酒屋)</option>
                        <option value="韓式料理">韓式料理 (烤肉/部隊鍋)</option>
                        <option value="義式餐酒館">義式餐酒館 (義大利麵/披薩)</option>
                        <option value="火鍋燒肉">火鍋 & 燒肉</option>
                        <option value="美式漢堡">美式漢堡 & 早午餐</option>
                        <option value="精緻咖啡廳">精緻咖啡廳 & 甜點</option>
                    </select>
                </div>

                <!-- Budget Select -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        <i class="fa-solid fa-wallet text-emerald-500 mr-1"></i> 預算等級
                    </label>
                    <select id="budgetSelect"
                        class="w-full bg-slate-900/80 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 transition">
                        <option value="all">不限預算</option>
                        <option value="$">($) 平價小吃 / 學生首選 (NT$200內)</option>
                        <option value="$$">($$) 舒適聚餐 / 中階價位 (NT$200 - $600)</option>
                        <option value="$$$">($$$) 精緻料理 / 約會聚餐 (NT$600 - $1500)</option> <option value="$$$$">($$$$) 奢華饗宴 / 米其林等級 (NT$1500以上)</option>
                    </select>
                </div>
            </form>

            <!-- Submit Button -->
            <div class="text-center">
                <button type="button" onclick="executeSearch()"
                    class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 via-purple-500 to-amber-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-pink-500/25 hover:shadow-pink-500/40 hover:scale-[1.02] active:scale-[0.98] transition">
                    <i class="fa-solid fa-magnifying-glass mr-2"></i> 開始尋找 Top 10 高評分餐廳
                </button>
            </div>
        </section>

        <!-- Results Section Header -->
        <div id="resultsHeader" class="hidden flex items-center justify-between mb-6">
            <div>
                <h3 id="resultTitle" class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-fire text-pink-500"></i> 推薦結果
                </h3>
                <p id="resultSubtitle" class="text-xs text-slate-400 mt-0.5">根據您的篩選條件精選出 10 家頂尖評分餐廳</p>
            </div>
            <div class="text-xs text-slate-400 bg-white/5 px-3 py-1.5 rounded-xl border border-white/10">
                排序：Google 評分最高優先
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden text-center py-20">
            <div class="inline-block w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-300 font-medium text-sm animate-pulse">正在連線 Google 地圖資料庫，為您計算評分與最佳路線...</p>
        </div>

        <!-- Results Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16">
            <!-- Cards will be injected dynamically via JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-8 border-t border-white/5">
        <p>Vibe Coding AI Assistant &bull; Designed for Ultimate User Experience</p>
    </footer>

    <!-- Lucky Draw Modal -->
    <div id="luckyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-md w-full rounded-3xl p-6 text-center relative border border-pink-500/30 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h4 class="text-lg font-bold text-white mb-2">今天吃這家！</h4>
            <div id="luckyContent" class="my-6 p-4 rounded-2xl bg-slate-900/90 border border-white/10 text-left">
                <!-- Random Restaurant Content -->
            </div>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-pink-600 text-white font-semibold text-sm hover:bg-pink-500 transition">
                太棒了，就決定是它！
            </button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let currentRestaurants = [];

        function executeSearch() {
            const location = document.getElementById('locationInput').value.trim();
            const cuisine = document.getElementById('cuisineSelect').value;
            const budget = document.getElementById('budgetSelect').value;

            if (!location) {
                alert('請先輸入您所在的地區或搜尋地點！');
                document.getElementById('locationInput').focus();
                return;
            }

            // Show Loading
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultsGrid').innerHTML = '';
            document.getElementById('resultsHeader').classList.add('hidden');

            // Simulate Network / Google Connection Delay
            setTimeout(() => {
                currentRestaurants = generateMockRestaurants(location, cuisine, budget);
                renderResults(location, cuisine);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('resultsHeader').classList.remove('hidden');
                
                // Smooth scroll to results
                document.getElementById('resultsHeader').scrollIntoView({ behavior: 'smooth' });
            }, 800);
        }

        function handleSearch(e) {
            e.preventDefault();
            executeSearch();
        }

        function generateMockRestaurants(location, cuisine, budget) {
            const names = [
                "極上旨味", "森川丼飯", "初魚料亭", "壹番町居酒屋", "玖肆燒肉", 
                "藏壽司美學", "花見川割烹", "御前手打烏龍", "武藏野拉麵", "晴空塔法式餐酒館",
                "幸褔烘焙咖啡", "黑毛屋本格鍋物", "炙燒食堂", "山形特盛", "川味麻辣功夫"
            ];
            
            const cuisinesMap = ["日式料理", "韓式料理", "義式餐酒館", "火鍋燒肉", "美式漢堡", "精緻咖啡廳"];
            const budgetsMap = ["$", "$$", "$$$", "$$$$"];
            
            let results = [];
            for (let i = 0; i < 10; i++) {
                const randomNamePrefix = names[Math.floor(Math.random() * names.length)];
                const cName = cuisine === 'all' ? cuisinesMap[Math.floor(Math.random() * cuisinesMap.length)] : cuisine;
                const bVal = budget === 'all' ? budgetsMap[Math.floor(Math.random() * budgetsMap.length)] : budget;
                
                // High ratings simulation (4.5 to 4.9)
                const rating = (4.5 + Math.random() * 0.4).toFixed(1);
                const reviews = Math.floor(Math.random() * 2500) + 320;
                
                results.push({
                    id: i + 1,
                    name: `${location}${randomNamePrefix}${i + 1}號店`,
                    cuisine: cName,
                    budget: bVal,
                    rating: parseFloat(rating),
                    reviews: reviews,
                    address: `${location}精華路段 ${Math.floor(Math.random() * 200) + 1}號`,
                    tags: [cName, bVal === '$' ? '平價高CP' : bVal === '$$$' ? '精緻約會' : '人氣排隊名店'],
                    googleSearchUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location + ' ' + randomNamePrefix + ' 餐廳')}`
                });
            }

            // Sort by rating descending
            return results.sort((a, b) => b.rating - a.rating);
        }

        function renderResults(location, cuisine) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            document.getElementById('resultTitle').innerHTML = `<i class="fa-solid fa-fire text-pink-500"></i> ${location} - Top 10 高評分餐廳`;

            currentrestaurants_safe = currentRestaurants;
            currentRestaurants.forEach((r, index) => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-3xl p-6 flex flex-col justify-between relative overflow-hidden group';
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-4 mb-3">
                            <div>
                                <span class="text-xs font-bold text-pink-400 bg-pink-500/10 px-2.5 py-1 rounded-full border border-pink-500/20 mr-2">#0${index + 1}</span>
                                <span class="text-xs text-slate-400"><i class="fa-solid fa-utensils mr-1"></i>${r.cuisine}</span>
                            </div>
                            <div class="flex items-center space-x-1 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-xl text-amber-400 font-bold text-xs">
                                <i class="fa-solid fa-star"></i>
                                <span>${r.rating}</span>
                                <span class="text-slate-400 font-normal">(${r.reviews})</span>
                            </div>
                        </div>

                        <h4 class="text-xl font-extrabold text-white group-hover:text-pink-400 transition mb-2">${r.name}</h4>
                        
                        <p class="text-xs text-slate-400 flex items-center mb-4">
                            <i class="fa-solid fa-location-dot text-slate-500 mr-1.5"></i> ${r.address}
                        </p>

                        <div class="flex flex-wrap gap-1.5 mb-6">
                            <span class="text-xs bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-slate-300">預算: ${r.budget}</span>
                            ${r.tags.map(t => `<span class="text-xs bg-white/5 border border-white/10 px-2.5 py-1 rounded-lg text-slate-300">${t}</span>`).join('')}
                        </div>
                    </div>

                    <div class="pt-4 border-t border-white/10 flex items-center justify-between">
                        <span class="text-xs text-emerald-400 flex items-center font-medium">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> 營業中
                        </span>
                        <a href="${r.googleSearchUrl}" target="_blank"
                            class="inline-flex items-center space-x-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-pink-600 text-white font-semibold text-xs transition shadow-sm">
                            <span>開啟 Google 地圖</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function triggerLuckyDraw() {
            if (currentRestaurants.length === 0) {
                alert('請先進行一次搜尋，讓美食探偵幫您列出餐廳清單！');
                document.getElementById('locationInput').focus();
                return;
            }
            const randomRest = currentRestaurants[Math.floor(Math.random() * currentRestaurants.length)];
            const content = document.getElementById('luckyContent');
            content.innerHTML = `
                <div class="text-xs text-pink-400 font-bold mb-1">🎉 運氣抽中推薦</div>
                <h5 class="text-lg font-extrabold text-white mb-1">${randomRest.name}</h5>
                <p class="text-xs text-slate-300 mb-2">${randomRest.cuisine} &bull; 評分 ${randomRest.rating} ⭐</p>
                <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i>${randomRest.address}</p>
            `;
            document.getElementById('luckyModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('luckyModal').classList.add('hidden');
        }
    </script>
</body>
</html>
